# Pasitiko (Tiko) configuration. Parsed with a real YAML parser:
# duplicate keys are an error. Secrets must be SecretRefs (env:NAME).
profile: default
workspace: "."

agent:
  max_iterations: 12
  max_tokens_per_task: 60000
  max_wall_clock_sec: 300
  max_tool_calls: 30

providers:
  default_chat: mock
  # tiers: pemetaan tier routing adaptif (ALG-06); tanpa ini semua tier
  # memakai default_chat:
  #   1: ollama_local   # ringan
  #   2: ollama_local
  #   3: ollama_local   # berat - ganti ke provider cloud bila dikonfigurasi
  chat:
    mock:
      type: mock
    ollama_local:
      type: openai_compat
      base_url: "http://127.0.0.1:11434/v1"
      model: "qwen2.5:3b"
    # cloud_example:
    #   type: openai_compat
    #   base_url: "https://api.openai.com/v1"
    #   model: "<model>"
    #   api_key: "env:OPENAI_API_KEY"
    # Preset provider (37 katalog): cukup type + api_key; baseUrl/model dari
    # katalog. Lihat docs/PROVIDER-PARITY-2026-11-12.md.
    # deepseek:
    #   type: deepseek
    #   api_key: "env:DEEPSEEK_API_KEY"
    #   # Credential pool: rotasi round-robin pada 401/403/429.
    #   api_keys: ["env:DEEPSEEK_KEY_2"]
    #   request_timeout_sec: 60
    #   model_timeouts: {"deepseek-reasoner": 180}
    #   context_length: 65536
    #   discover_models: true
    # azure:
    #   type: azure_openai
    #   base_url: "https://RESOURCE.openai.azure.com"
    #   model: gpt-4o-deploy
    #   api_key: "env:AZURE_OPENAI_KEY"
    #   api_version: "2024-10-21"
    # bedrock:
    #   type: bedrock
    #   region: us-east-1
    #   model: anthropic.claude-sonnet-4-20250514-v1:0
    #   access_key_id: "env:AWS_ACCESS_KEY_ID"
    #   secret_access_key: "env:AWS_SECRET_ACCESS_KEY"
    #   session_token: "env:AWS_SESSION_TOKEN"
    # oauth_provider:
    #   type: openai_compat
    #   base_url: "https://api.example.com/v1"
    #   oauth_device_url: "https://auth.example.com/device/code"
    #   oauth_token_url: "https://auth.example.com/oauth/token"
    #   oauth_client_id: "client-id"
    #   oauth_scopes: ["read", "write"]
    #   oauth_token_cache: "/tmp/tiko-oauth-token.json"

security:
  mode: ask
  shell_allowlist: ["ls", "cat", "git status", "pwd", "echo"]
  require_confirm: ["write_file", "patch_file", "shell", "http_post", "http_request", "schedule_job"]

search:
  searxng_base_url: "http://127.0.0.1:8080"

# Fitur opsional (P1-10 happy-path: lihat docs/10-HAPPY-PATH-MANUAL.md):
# generate_image butuh image_generation: true + fal_api_key SecretRef.
# Vision (analisis gambar) butuh vision: true + openai_api_key SecretRef.
features:
  image_generation: false
  vision: false
  # fal_api_key: "env:FAL_KEY"
  # openai_api_key: "env:OPENAI_API_KEY"

http:
  domain_allowlist: ["example.com", "api.github.com"]

storage:
  data_dir: "data"
  db_path: "data/agent.db"

api:
  port: 8787

mcp:
  servers: []

scheduler:
  tick_interval_sec: 20

# Env flags (not YAML): AGENT_REFLECT, AGENT_SELF_CONSISTENCY,
# AGENT_AUTO_REFLECT_TOOLS, AGENT_PROBE, OLLAMA_EMBED, AGENT_UI, API_TOKEN, API_PORT
